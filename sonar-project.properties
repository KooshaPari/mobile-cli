# SonarCloud configuration for mobile-cli.
#
# Project key matches the existing convention used by
# KooshaPari/phenotype-fleet-ops (KooshaPari_phenotype-fleet-ops):
#   KooshaPari_mobile-cli  (i.e. ownerName_repoName, dash-to-underscore)
#
# The project must be registered in the SonarCloud org before
# the workflow scan will succeed. This file is the in-repo config;
# registration is a one-time org-level step in the SonarCloud UI.

sonar.projectKey=KooshaPari_mobile-cli
sonar.organization=kooshapari

sonar.projectName=mobile-cli
sonar.projectVersion=1.0.0

sonar.sources=.
sonar.exclusions=\
  **/vendor/**,\
  **/node_modules/**,\
  **/*.pb.go,\
  **/testdata/**

sonar.tests=.
sonar.test.inclusions=\
  **/*_test.go

sonar.go.coverage.reportPaths=coverage/coverage.out

sonar.sourceEncoding=UTF-8
sonar.links.homepage=https://github.com/KooshaPari/mobile-cli
sonar.links.scm=https://github.com/KooshaPari/mobile-cli.git
sonar.links.ci=https://github.com/KooshaPari/mobile-cli/actions
