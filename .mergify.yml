# Mergify configuration for mobile-cli.
#
# Before this PR: required check names referenced 'ci', 'lint', 'typecheck', 'test'
# which were never the actual GitHub Actions context names emitted by ci.yml.
# Result: the merge-queue check stayed red on every PR.
#
# Actual contexts emitted by ci.yml on mobile-cli main:
#   - ci/lint
#   - ci/test
#   - SonarCloud Code Analysis
#   - Dependabot / Dep Review (org-disabled, treats as advisory)
#
# The merge queue never blocks anything substantive today; this file is
# kept here as a forward-looking config that becomes effective once the
# SonarCloud project is registered in the kooshapari org.

queue_rules:
  - name: default
    conditions:
      - check-success=ci/lint
      - check-success=ci/test
      - check-success=SonarCloud Code Analysis

pull_request_rules:
  - name: automatic merge on green
    conditions:
      - check-success=ci/lint
      - check-success=ci/test
      - check-success=SonarCloud Code Analysis
      - -conflict
      - approved-reviews-by=@KooshaPari
    actions:
      merge:
        method: squash
        delete_branch: true
